name: build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: sudo apt-get update -q && sudo apt-get install -y -q mingw-w64 zip
      - name: Version
        id: ver
        run: |
          ver=$(make -s version)
          test -n "$ver"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
      - name: Build
        run: make -j4 dist
      - uses: actions/upload-artifact@v4
        with:
          name: PhawxON-${{ steps.ver.outputs.ver }}
          path: dist/PhawxON-${{ steps.ver.outputs.ver }}.zip
      - name: Release v${{ steps.ver.outputs.ver }}
        if: contains(github.event.head_commit.message, '[release]') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          cp build/PhawxON.exe dist/PhawxON.exe
          if gh release view "v$VER" >/dev/null 2>&1; then
            gh release upload "v$VER" "dist/PhawxON-$VER.zip" dist/PhawxON.exe --clobber
          else
            gh release create "v$VER" "dist/PhawxON-$VER.zip" dist/PhawxON.exe \
              --target "${{ github.sha }}" --title "Phawx ON $VER" --notes-file RELEASE_NOTES.md
          fi
